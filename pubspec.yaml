name: grocery_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  carousel_slider: ^5.0.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.1.0
  font_awesome_flutter: ^10.8.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  video_player: ^2.9.5
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  smooth_page_indicator: ^1.2.1
  share_plus: ^11.0.0
  country_state_city_pro: ^0.0.6
  image_picker: ^1.0.7
  country_state_city_picker: ^1.2.8
  uuid: ^4.5.1
  dio: ^5.8.0+1
  webview_flutter: ^4.13.0
  flutter_local_notifications: ^16.3.2
  firebase_core: ^3.15.1
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.8
  skeletonizer: ^1.4.3
  order_tracker: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/icons/account_icons/
    - assets/images/beverages_images/
    - assets/images/categories_images/
    - assets/images/grocery_images/
    - assets/videos/

flutter_icons:
  image_path: "assets/icons/app_icons/splash_icon.jpeg"
  android: true
  ios: true
