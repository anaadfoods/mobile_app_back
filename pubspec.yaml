name: grocery_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
    
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.1.0
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/icons/account_icons/
    - assets/images/beverages_images/
    - assets/images/categories_images/
    - assets/images/grocery_images/
    - assets/videos/
