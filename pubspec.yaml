name: grocery_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  carousel_slider: ^5.0.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.1.0
  font_awesome_flutter: ^10.8.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/icons/account_icons/
    - assets/images/beverages_images/
    - assets/images/categories_images/
    - assets/images/grocery_images/
    - assets/videos/
